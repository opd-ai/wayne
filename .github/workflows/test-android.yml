name: Test Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-android:
    name: Verify Android Build Tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify code compiles with android build tag
        run: |
          # Verify the package compiles when android build tag is active
          # This confirms the build constraints are correct
          GOOS=android GOARCH=arm64 go build -tags android ./...
          
      - name: Vet code with android build tag
        run: |
          # Run go vet with android tags to check for issues
          GOOS=android GOARCH=arm64 go vet -tags android ./... || true
