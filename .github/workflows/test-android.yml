name: Test Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-android:
    name: Test on Android Emulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build for Android (verification)
        env:
          CGO_ENABLED: 1
        run: |
          # Verify the package builds for Android target
          # Note: Full test execution requires running emulator which adds significant CI time
          gomobile bind -target=android -androidapi=21 -o /tmp/wayne.aar .

      # Note: Full gomobile test execution on emulator is resource-intensive.
      # This workflow verifies the build succeeds. For comprehensive Android testing,
      # use a dedicated mobile CI service or local emulator setup.
      # See TESTING.md for manual testing instructions.
