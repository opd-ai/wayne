name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Install dependencies
        run: go mod download
      
      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test -v -race ./...
      
      - name: Run vet
        run: go vet ./...

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Install dependencies
        run: go mod download
      
      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test -v -race ./...
      
      - name: Run vet
        run: go vet ./...

  # Android and iOS testing require emulators and more complex setup
  # These are documented as TODO and require dedicated runners or cloud devices
  # See README.md for current platform testing status
