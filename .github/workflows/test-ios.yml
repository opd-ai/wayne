name: Test iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-ios:
    name: Verify iOS Compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests on macOS
        env:
          CGO_ENABLED: 1
        run: |
          # Run unit tests on macOS which shares darwin build tags with iOS
          # The same code paths are exercised since both use the darwin tag
          go test -v -race -short ./...
