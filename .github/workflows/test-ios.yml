name: Test iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-ios:
    name: Test on iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build for iOS (verification)
        env:
          CGO_ENABLED: 1
        run: |
          # Verify the package builds for iOS target
          # Note: Full test execution requires iOS Simulator which adds significant CI time
          gomobile bind -target=ios -o /tmp/Wayne.xcframework .

      # Note: Full gomobile test execution on iOS Simulator is resource-intensive.
      # This workflow verifies the build succeeds. For comprehensive iOS testing,
      # use a dedicated mobile CI service or local simulator setup.
      # See TESTING.md for manual testing instructions.
