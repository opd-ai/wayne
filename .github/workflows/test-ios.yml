name: Test iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-ios:
    name: Test on iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install gomobile
        run: |
          # Pin to a specific gomobile version for reproducibility
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250106192035-c31d5b91ecc3
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250106192035-c31d5b91ecc3
          gomobile init

      - name: Build for iOS (verification)
        env:
          CGO_ENABLED: 1
        run: |
          # Verify the package builds for iOS target
          gomobile bind -target=ios -o /tmp/Wayne.xcframework .

      - name: Boot iOS Simulator
        run: |
          # List available simulators and boot an iPhone
          SIMULATOR_ID=$(xcrun simctl list devices available --json | \
            python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; \
            iphones=[d for r in devs.values() for d in r if 'iPhone' in d.get('name','')]; \
            print(iphones[0]['udid'] if iphones else '')")
          if [ -n "$SIMULATOR_ID" ]; then
            xcrun simctl boot "$SIMULATOR_ID" || true
            echo "SIMULATOR_UDID=$SIMULATOR_ID" >> $GITHUB_ENV
          fi

      - name: Run iOS tests on simulator
        env:
          CGO_ENABLED: 1
        run: |
          # Run gomobile tests on the iOS simulator
          gomobile test -target=ios/simulator ./...
