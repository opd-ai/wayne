name: Test iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-ios:
    name: Verify iOS Build Tags
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify code compiles with ios build tag
        run: |
          # Verify the package compiles when ios build tag is active
          # This confirms the build constraints are correct
          go build -tags ios ./...
          go vet -tags ios ./...

      - name: Run tests on macOS (covers darwin build tag)
        env:
          CGO_ENABLED: 1
        run: |
          # Run unit tests on macOS which shares the darwin tag with iOS
          # Full iOS testing requires physical devices or more complex simulator setup
          go test -v -race -short ./...
